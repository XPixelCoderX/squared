name: CI & Pages

# Runs the test suite on every push and PR, and publishes the production build
# to GitHub Pages whenever main moves.
#
# One-time setup in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# The site then lives at https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (also re-runs typecheck)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # a job-level block replaces the workflow-level one
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Vite emits relative asset URLs (base: "./"), so the build works from a
      # project subpath such as /squared/ without extra configuration.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # creates the Pages site if it is not enabled yet; already-existing
          # "Deploy from a branch" sites must be switched by hand in Settings
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
